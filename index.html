<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <title>La calma</title>
        <style type="text/css">
            @import url("css/estils.css");
        </style>
    </head>
    <body>
        <main class="requadre">
            <nav class="navegacio">
                <a href="index.html">La meditació</a>
                <a href="segon.html">L'aire lliure</a>
                <a href="tercer.html">L'aigua</a>
            </nav>
            <h1>La Meditació</h1>
            <p>Com podem definir la meditació: 
                <span id="paraula"
                    onmouseover="mostrar()"
                    onmouseout="ocultar()"
                    style="cursor: pointer; text-decoration: underline;">
                </span>
            </p>
            <div id="ocult">La meditació és una de les formes de relaxació
            més simples i eficaces, ja que no es necessari assistir a classes de yoga o pilates, sols un lloc tranquil,
            tu i la teva ment, concentran-te.</div>
            <script>
                function mostrar() {
                    document.getElementById('ocult').element.style.visibility = 'visible';
                }

                function ocultar() {
                    document.getElementById('ocult').element.style.visibility = 'hidden';
                }
            </script>
        </main>
    </body>
</html>
